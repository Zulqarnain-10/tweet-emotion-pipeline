[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tweet-emotion-pipeline"
version = "0.1.0"
description = "A tweet emotion classifier built and tracked as a DVC pipeline: hashed data, six stages, params.yaml, receipts, a tested FastAPI endpoint, CI/CD, and a live demo."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Syed Zulqarnain Hassan" }]
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=1.26,<3",
  "scipy>=1.13",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4",
  "pyyaml>=6",
  "nltk>=3.9",
  "xgboost-cpu>=3.0",
  "pydantic>=2.7,<3",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "httptools>=0.6",
  "prometheus-fastapi-instrumentator>=7",
  "httpx>=0.27",
  "python-json-logger>=2",
]

[project.optional-dependencies]
pipeline = [
  "dvc>=3.50",
  "matplotlib>=3.9",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "pre-commit>=3.7",
  "huggingface_hub>=1.0",
]

[project.urls]
Homepage = "https://github.com/Zulqarnain-10/tweet-emotion-pipeline"
Author = "https://zulqarnainhassan.com"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tweet_emotion.api" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = [".venv", "data", ".space_build"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF012", "N803", "N806", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=tweet_emotion --cov-report=term-missing --cov-report=xml"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = ["slow: trains a model on a small sample"]

[tool.coverage.run]
source = ["tweet_emotion"]
omit = ["*/loadtest.py"]
